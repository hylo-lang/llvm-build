name: 'Free disk space'
description: 'Removes preinstalled software from Linux runners to make room for LLVM builds'
inputs:
  min-free-gb:
    description: 'If set, remove docs and caches, but only when less than this many GiB are free'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
    - name: Remove preinstalled SDKs
      if: runner.os == 'Linux' && inputs.min-free-gb == ''
      shell: bash
      run: |
        echo "Available disk space before cleanup:"
        df -h /

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY" /usr/local/lib/node_modules /usr/share/swift /usr/local/lib/heroku
        sudo apt-get remove -y '^ghc-*' '^dotnet-*' || true
        sudo apt-get autoremove -y

        echo "Available disk space after cleanup:"
        df -h /

    - name: Remove documentation and caches if space is low
      if: runner.os == 'Linux' && inputs.min-free-gb != ''
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-gb }}
      run: |
        available_kb=$(df --output=avail / | tail -1)
        echo "Available space: ${available_kb} KiB"
        if [ "$available_kb" -ge $((MIN_FREE_GB * 1024 * 1024)) ]; then
          exit 0
        fi

        echo "Less than ${MIN_FREE_GB} GiB free, removing docs and caches"
        sudo rm -rf /usr/local/share/vcpkg /usr/local/share/gem /usr/share/doc /usr/share/man \
          /var/cache/apt || true
        sudo journalctl --vacuum-time=1d || true

        echo "Disk space after cleanup:"
        df -h /
