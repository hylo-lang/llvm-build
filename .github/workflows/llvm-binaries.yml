name: build-llvm-binaries

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM Version'
        required: true
        default: '23.1.0'
        type: string
      release:
        description: 'Publish a release when every build succeeds'
        required: false
        default: true
        type: boolean

env:
  SCCACHE_DIRECT: true
  llvm_version: ${{ github.event.inputs.llvm_version }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  distribution:
    needs: [checks]
    strategy:
      fail-fast: false

      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
        arch: [x86_64, arm64]
        configuration: [Debug, MinSizeRel]

        include:
          # Default values
          - c_compiler: clang
          - cmake_msvc_options:
          - cmake_find_root_path_option:
          - cmake_system_processor_option:
          - compile_cache_max_size: 1G
          - cxx_compiler: clang++
          - executable_suffix:
          - llvm_target_arch_option:
          - zstd_level: 3
          - package_suffix: .tar.zst
          - static_lib_suffix: .a
          - toolset_suffix:
          - triple_cpu:
          - install_target: install-distribution-stripped

          # Overrides
          - configuration: Debug

            compile_cache_max_size: 2G
            install_target: install-distribution

          - os: windows-2025

            c_compiler: cl
            # Swift's runtime is compiled this way, and can't be
            # linked to a C++ binary with other settings.
            cmake_msvc_options: -D CMAKE_CXX_FLAGS=-D_ITERATOR_DEBUG_LEVEL=0 -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
            cxx_compiler: cl
            executable_suffix: .exe
            # The Debug package exceeds GitHub's 2 GiB release asset limit at
            # zstd's default level, so compress harder.
            zstd_level: 9
            static_lib_suffix: .lib
            toolset_suffix: -msvc17

          - arch: x86_64

            triple_cpu: x86_64

          - arch: arm64

            triple_cpu: arm64

          - arch: arm64
            os: ubuntu-24.04

            triple_cpu: aarch64

          # macOS debug symbol compatibility fixes
          - os: macos-15
            configuration: Debug

            cmake_debug_options: >-
              -D CMAKE_C_FLAGS_DEBUG="-g -gdwarf-4 -fno-limit-debug-info"
              -D CMAKE_CXX_FLAGS_DEBUG="-g -gdwarf-4 -fno-limit-debug-info"

          # Extensions

          - os: windows-2025

            cmake_system_name: Windows
            triple_suffix: unknown-windows-msvc17

          - os: ubuntu-24.04

            cmake_system_name: Linux
            triple_suffix: unknown-linux-gnu

          - os: macos-15

            cmake_system_name: Darwin
            triple_suffix: apple-darwin24.1.0

          # Runner mapping for architecture-specific runners
          - os: ubuntu-24.04
            arch: x86_64
            runner: ubuntu-24.04

          - os: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: macos-15
            arch: x86_64
            runner: macos-15-intel

          - os: macos-15
            arch: arm64
            runner: macos-15

          - os: windows-2025
            arch: x86_64
            runner: windows-2025

          # GitHub has no windows-2025 image for arm64, but windows-11-arm has the same Visual Studio.
          - os: windows-2025
            arch: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    env:
      PACKAGE_NAME: llvm-${{ github.event.inputs.llvm_version }}-${{ matrix.triple_cpu }}-${{ matrix.triple_suffix }}-${{ matrix.configuration }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./SourceCache/llvm-build
          show-progress: false

      - name: Free up disk space
        uses: ./SourceCache/llvm-build/.github/actions/free-disk-space

      - name: Set up specific Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: ${{ runner.os == 'macOS' }}
        with:
          xcode-version: '26.0.1'

      # Swift on Windows uses MSVC 14.44 and Windows SDK 10.0.22621.0. Visual Studio 2026 on the images
      # defaults to newer ones, and libraries built with those would need them in every consumer too.
      # We install 22621 if the runner image doesn't have it already.
      - name: Install Windows SDK 10.0.22621.0
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.22621.0\ucrt") { exit 0 }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $p = Start-Process -Wait -PassThru "$installer\setup.exe" -ArgumentList `
            "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart --nocache"
          exit $p.ExitCode

      - name: Set up MSVC 14.44 with Windows SDK 10.0.22621.0
        uses: compnerd/gha-setup-vsdevenv@452f99effa381b81c025ccfbdccaca509bff1b29 # v7
        if: runner.os == 'Windows'
        with:
          winsdk: "10.0.22621.0"
          toolset_version: "14.44"

      - name: Verify Windows toolchain matches the package triple
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk  = $env:WindowsSDKVersion.TrimEnd('\')
          $ucrt = $env:UCRTVersion
          $msvc = Split-Path -Leaf $env:VCToolsInstallDir.TrimEnd('\')
          Write-Host "MSVC $msvc, Windows SDK $sdk, UCRT $ucrt"

          $problems = @()
          if ($sdk -ne '10.0.22621.0')  { $problems += "WindowsSDKVersion is $sdk, expected 10.0.22621.0" }
          if ($ucrt -ne '10.0.22621.0') { $problems += "UCRTVersion is $ucrt, expected 10.0.22621.0" }
          if ($msvc -notlike '14.44.*') { $problems += "MSVC toolset is $msvc, expected 14.44.x (VS 2022)" }

          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Set up LLVM build tools and sources
        uses: ./SourceCache/llvm-build/.github/actions/build-tools
        with:
          llvm_version: ${{ env.llvm_version }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          ninjaVersion: 1.13.2
          cmakeVersion: 4.2.0

      - name: Setup sccache
        id: sccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          max-size: ${{ matrix.compile_cache_max_size }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-package
          variant: sccache
          append-timestamp: false

      - name: Configure LLVM
        run: >-
          cmake -GNinja
          -S ${{ github.workspace }}/SourceCache/llvm-project/llvm
          -B ${{ github.workspace }}/BinaryCache/1
          -C ${{ github.workspace }}/SourceCache/llvm-build/cmake/caches/LLVM-${{ matrix.configuration }}.cmake
          -D CMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -D CMAKE_C_COMPILER_LAUNCHER=sccache
          -D CMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          ${{ matrix.cmake_debug_options }}
          -D CMAKE_MT=mt
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}
          ${{ matrix.cmake_msvc_options }}
          -D LLVM_CONFIG_PATH=${{ github.workspace }}/BinaryCache/0/bin/llvm-config${{ matrix.executable_suffix }}
          -D LLVM_NATIVE_TOOL_DIR=${{ github.workspace }}/BinaryCache/0/bin
          -D LLVM_TABLEGEN=${{ github.workspace }}/BinaryCache/0/bin/llvm-tblgen${{ matrix.executable_suffix }}

      - name: Build LLVM
        run: cmake --build ${{ github.workspace }}/BinaryCache/1 --target distribution ${{ runner.os == 'Windows' && matrix.configuration == 'Debug' && '--verbose' || '' }}

      - name: Reclaim disk space after build
        if: ${{ runner.os != 'Windows' }}
        run: |
          echo "Disk space before build cleanup:"
          df -h
          
          # Remove object files and intermediate build artifacts
          find ${{ github.workspace }}/BinaryCache/ -name '*.o' -print0 | xargs -0 rm -f
          find ${{ github.workspace }}/BinaryCache/ -name '*.obj' -print0 | xargs -0 rm -f
          find ${{ github.workspace }}/BinaryCache/ -name '*.tmp' -print0 | xargs -0 rm -f
 
          echo "Disk space after build cleanup:"
          df -h

      - name: Install LLVM
        run: cmake --build ${{ github.workspace }}/BinaryCache/1 --target ${{ matrix.install_target }}

      - name: Validate debug symbols (macOS Debug)
        if: ${{ runner.os == 'macOS' && matrix.configuration == 'Debug' }}
        shell: bash
        run: |
          echo "=== Debug Symbol Validation ==="
          echo "Xcode version: $(xcode-select --print-path)"
          echo "dsymutil version: $(dsymutil --version)"
          echo "clang version: $(clang --version)"
          
          # Test debug symbol format on a sample library
          SAMPLE_LIB=$(find ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/lib -name "*.a" | head -1)
          if [ -n "$SAMPLE_LIB" ]; then
            echo "Testing debug symbols in: $SAMPLE_LIB"
            dwarfdump --verify "$SAMPLE_LIB" 2>&1 | head -20 || true
            
            echo "DWARF sections:"
            dwarfdump --debug-info=0x0 "$SAMPLE_LIB" 2>&1 | head -10 || true
          fi

      - name: Test binary compatibility
        shell: bash
        run: |
          echo "=== Testing Binary Compatibility ==="
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Target Arch: ${{ matrix.arch }}"
          echo "Target Triple: ${{ matrix.triple_cpu }}-${{ matrix.triple_suffix }}"
          echo ""
          
          # Test llvm-config
          echo "Testing llvm-config..."
          "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llvm-config${{ matrix.executable_suffix }}" --version
          
          # Verify RISCV target support for ESP32-C3 cross compilation
          echo "Checking RISCV target availability..."
          if "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llvm-config${{ matrix.executable_suffix }}" --targets-built | grep -qw RISCV; then
            echo "RISCV target support detected."
          else
            echo "::error::RISCV target support was not found in this package."
            exit 1
          fi

      - name: Make llvm.pc pkg-config file
        shell: bash
        run: 'export PATH="${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin:$PATH" && "${{ github.workspace }}/SourceCache/llvm-build/scripts/make-pkgconfig.sh" "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/llvm.pc"'

      - name: Copy pkg-config Installation Scripts
        run: |
          cp ${{ github.workspace }}/SourceCache/llvm-build/scripts/install-pc.sh ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/install-pc.sh
          cp ${{ github.workspace }}/SourceCache/llvm-build/scripts/make-absolute-pc.sh ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/make-absolute-pc.sh
          chmod +x ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/install-pc.sh
          chmod +x ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/make-absolute-pc.sh

      # Don't use the image's tar for zstd: on windows-2022 it hung for hours.
      - name: Package LLVM
        working-directory: ${{ github.workspace }}/BuildRoot/
        shell: bash
        timeout-minutes: 30
        run: tar -cf - "${{ env.PACKAGE_NAME }}" | zstd -T0 -${{ matrix.zstd_level }} -o "${{ github.workspace }}/${{ env.PACKAGE_NAME }}${{ matrix.package_suffix }}"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}${{ matrix.package_suffix }}
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          retention-days: 3

      - name: Clear old sccache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete sccache-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-package- --confirm -R ${{ github.repository }}
        continue-on-error: true

  # LLVM that runs in WebAssembly, for the Hylo playground. It's built against the Swift wasm SDK
  # and only works with that Swift version.
  wasi:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      SWIFT_VERSION: '6.3.2'
      SWIFT_SDK: swift-6.3.2-RELEASE_wasm
      # Published at https://www.swift.org/install/linux/.
      SWIFT_SDK_URL: https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz
      SWIFT_SDK_CHECKSUM: a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      PACKAGE_NAME: llvm-${{ inputs.llvm_version }}-wasm32-unknown-wasip1-swift6.3.2-MinSizeRel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./SourceCache/llvm-build
          show-progress: false

      # Native tablegen for the cross build.
      - name: Set up LLVM build tools and sources
        uses: ./SourceCache/llvm-build/.github/actions/build-tools
        with:
          llvm_version: ${{ env.llvm_version }}

      - name: Set up Swift ${{ env.SWIFT_VERSION }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the Swift SDK for WebAssembly
        run: swift sdk install "$SWIFT_SDK_URL" --checksum "$SWIFT_SDK_CHECKSUM"

      # Not in SourceCache/llvm-project, which is cached and shared with the native builds.
      - name: Fetch and patch the LLVM sources
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "llvmorg-$llvm_version" --filter=blob:none --sparse \
            https://github.com/llvm/llvm-project.git SourceCache/llvm-project-wasi
          # libc for its headers.
          git -C SourceCache/llvm-project-wasi sparse-checkout set llvm lld cmake third-party libunwind libc
          git -C SourceCache/llvm-project-wasi apply "$GITHUB_WORKSPACE/SourceCache/llvm-build/patches/llvm-wasi-host.patch"

      - name: Build LLVM
        run: >-
          node SourceCache/llvm-build/ci/build-llvm-wasi.ts
          --sdk "$SWIFT_SDK"
          --source SourceCache/llvm-project-wasi
          --native-tools BinaryCache/0/bin
          --build BinaryCache/wasi
          --prefix "BuildRoot/$PACKAGE_NAME"

      - name: Copy pkg-config Installation Scripts
        run: |
          cp SourceCache/llvm-build/scripts/install-pc.sh SourceCache/llvm-build/scripts/make-absolute-pc.sh \
            "BuildRoot/$PACKAGE_NAME/pkgconfig/"

      - name: Package LLVM
        working-directory: ${{ github.workspace }}/BuildRoot/
        timeout-minutes: 30
        run: tar -cf - "$PACKAGE_NAME" | zstd -T0 -3 -o "$GITHUB_WORKSPACE/$PACKAGE_NAME.tar.zst"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.tar.zst
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          retention-days: 3

  # Release everything at once, so that a failed run doesn't leave a partial release behind.
  release:
    needs: [distribution, wasi]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true

      - name: Choose the tag
        id: tag
        run: |
          tag=$(git ls-remote --tags --refs origin | cut -f2 | node ci/next-release-tag.ts "$llvm_version")
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: packages/*
          fail_on_unmatched_files: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.tag.outputs.name }}" --draft=false --repo "${{ github.repository }}"
