name: build-llvm-binaries

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM Version'
        required: true
        default: '20.1.6'
        type: string

env:
  SCCACHE_DIRECT: true
  llvm_version: ${{ github.event.inputs.llvm_version }}

jobs:
  create_tag:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.timestamp.outputs.time }}

    steps:
    - uses: actions/checkout@v4
      with:
        show-progress: false

    - name: Capture time
      uses: Kaven-Universe/github-action-current-date-time@v1
      id: timestamp
      with:
        format: "YYYYMMDD-HHmmss"

    - name: Create the tag.
      uses: EndBug/latest-tag@latest
      with:
        ref: ${{ steps.timestamp.outputs.time }}

  distribution:
    needs: [create_tag]

    strategy:
      fail-fast: false

      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
        arch: [x86_64, arm64]
        configuration: [Debug, MinSizeRel]

        include:
          # Default values
          - c_compiler: clang
          - cmake_msvc_options:
          - cmake_find_root_path_option:
          - cmake_system_processor_option:
          - compile_cache_max_size: 1G
          - cxx_compiler: clang++
          - executable_suffix:
          - llvm_target_arch_option:
          - package_command: tar --zstd -cf
          - package_suffix: .tar.zst
          - static_lib_suffix: .a
          - toolset_suffix:
          - triple_cpu:
          - install_target: install-distribution-stripped
          - llvm_distribution_tools: addr2line;ar;c++filt;dsymutil;dwp;lld;llvm-ar;llvm-config;llvm-cov;llvm-cvtres;llvm-cxxfilt;llvm-dlltool;llvm-dwarfdump;llvm-dwp;llvm-lib;llvm-lipo;llvm-mt;llvm-nm;llvm-objcopy;llvm-objdump;llvm-pdbutil;llvm-profdata;llvm-ranlib;llvm-rc;llvm-readelf;llvm-readobj;llvm-size;llvm-strings;llvm-strip;llvm-symbolizer;llvm-undname;nm;objcopy;objdump;ranlib;readelf;size;strings;wasm-ld
          - zstd_root_option:

          # Overrides
          - configuration: Debug

            compile_cache_max_size: 2G
            install_target: install-distribution
            llvm_distribution_tools: lld;llvm-config;wasm-ld

          - os: windows-2025

            c_compiler: cl
            # Swift's runtime is compiled this way, and can't be
            # linked to a C++ binary with other settings.
            cmake_msvc_options: -D CMAKE_CXX_FLAGS=-D_ITERATOR_DEBUG_LEVEL=0 -D CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
            cxx_compiler: cl
            executable_suffix: .exe
            static_lib_suffix: .lib
            toolset_suffix: -msvc17

          - arch: x86_64

            triple_cpu: x86_64

          - arch: arm64

            triple_cpu: arm64

          - arch: arm64
            os: ubuntu-24.04

            triple_cpu: aarch64

          - arch: arm64
            os: macos-15

            zstd_root_option: -D zstd_ROOT=/opt/local

          # macOS debug symbol compatibility fixes
          - os: macos-15
            configuration: Debug

            cmake_debug_options: >-
              -D CMAKE_C_FLAGS_DEBUG="-g -gdwarf-4 -fno-limit-debug-info"
              -D CMAKE_CXX_FLAGS_DEBUG="-g -gdwarf-4 -fno-limit-debug-info"

          # Extensions
          - arch: arm64

            llvm_backend_libs: 'LLVMAArch64AsmParser;LLVMAArch64CodeGen;LLVMAArch64Desc;LLVMAArch64Disassembler;LLVMAArch64Info;LLVMAArch64Utils;LLVMRISCVAsmParser;LLVMRISCVCodeGen;LLVMRISCVDesc;LLVMRISCVDisassembler;LLVMRISCVInfo;LLVMWebAssemblyAsmParser;LLVMWebAssemblyCodeGen;LLVMWebAssemblyDesc;LLVMWebAssemblyDisassembler;LLVMWebAssemblyInfo;LLVMWebAssemblyUtils'

          - arch: x86_64

            llvm_backend_libs: 'LLVMX86AsmParser;LLVMX86CodeGen;LLVMX86Desc;LLVMX86Disassembler;LLVMX86Info;LLVMX86TargetMCA;LLVMRISCVAsmParser;LLVMRISCVCodeGen;LLVMRISCVDesc;LLVMRISCVDisassembler;LLVMRISCVInfo;LLVMWebAssemblyAsmParser;LLVMWebAssemblyCodeGen;LLVMWebAssemblyDesc;LLVMWebAssemblyDisassembler;LLVMWebAssemblyInfo;LLVMWebAssemblyUtils'

          - os: windows-2025

            cmake_system_name: Windows
            triple_suffix: unknown-windows-msvc17

          - os: ubuntu-24.04

            cmake_system_name: Linux
            triple_suffix: unknown-linux-gnu

          - os: macos-15

            cmake_system_name: Darwin
            triple_suffix: apple-darwin24.1.0

          # Runner mapping for architecture-specific runners
          - os: ubuntu-24.04
            arch: x86_64
            runner: ubuntu-24.04

          - os: ubuntu-24.04
            arch: arm64
            runner: ubuntu-24.04-arm

          - os: macos-15
            arch: x86_64
            runner: macos-15-intel

          - os: macos-15
            arch: arm64
            runner: macos-15

          - os: windows-2025
            arch: x86_64
            runner: windows-2025

          - os: windows-2025
            arch: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    env:
      PACKAGE_NAME: llvm-${{ github.event.inputs.llvm_version }}-${{ matrix.triple_cpu }}-${{ matrix.triple_suffix }}-${{ matrix.configuration }}

    steps:
      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      - name: Free up disk space for debug builds
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "Available disk space before cleanup:"
          df -h
          
          # Remove .NET and related tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Remove additional large packages and caches
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/heroku
          
          # Remove unnecessary packages
          sudo apt-get remove -y '^ghc-*' '^dotnet-*' || true
          sudo apt-get autoremove -y
          
          echo "Available disk space after cleanup:"
          df -h

      - name: Set up specific Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        if: ${{ runner.os == 'macOS' }}
        with:
          xcode-version: '26.0.1'

      - uses: actions/checkout@v4
        with:
          path: ./SourceCache/llvm-build
          show-progress: false

      - name: Set up LLVM build tools and sources
        uses: ./SourceCache/llvm-build/.github/actions/build-tools
        with:
          llvm_version: ${{ env.llvm_version }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          ninjaVersion: 1.13.2
          cmakeVersion: 4.2.0

      - name: Setup sccache
        id: sccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          max-size: ${{ matrix.compile_cache_max_size }}
          key: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-package
          variant: sccache
          append-timestamp: false

      - uses: compnerd/gha-setup-vsdevenv@main

      - name: Workaround MSVC#10444970
        if: ${{ matrix.arch == 'arm64' && runner.os == 'Windows' }}
        run: |
          $clangTooling = "${{ github.workspace }}/SourceCache/llvm-project/clang/lib/Tooling/Inclusions/Stdlib/CMakeLists.txt"
          Set-Content $clangTooling @"
          $(Get-Content -Raw $clangTooling)
          set_source_files_properties(StandardLibrary.cpp PROPERTIES
            COMPILE_FLAGS "/Od /Gw /Oi /Oy /Gw /Ob2 /Ot /GF")
          "@

          $clangCodeGen = "${{ github.workspace }}/SourceCache/llvm-project/clang/lib/CodeGen/CMakeLists.txt"
          Set-Content $clangCodeGen @"
          $(Get-Content -Raw $clangCodeGen)
          set_source_files_properties(CGBuiltin.cpp PROPERTIES
            COMPILE_FLAGS "/Od /Gw /Oi /Oy /Gw /Ob2 /Ot /GF")
          "@

      - name: Install prerequisites (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install zstd

      - name: Configure LLVM
        run: >-
          cmake -GNinja
          -D CMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -S ${{ github.workspace }}/SourceCache/llvm-project/llvm
          -B ${{ github.workspace }}/BinaryCache/1
          -C ${{ github.workspace }}/SourceCache/llvm-build/cmake/caches/LLVM.cmake
          -D CMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -D CMAKE_C_COMPILER_LAUNCHER=sccache
          -D CMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          ${{ matrix.cmake_debug_options }}
          -D CMAKE_MT=mt
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}
          ${{ matrix.cmake_msvc_options }}
          -D LLVM_DISTRIBUTION_COMPONENTS="${{ matrix.llvm_backend_libs }};LLVMAggressiveInstCombine;LLVMAnalysis;LLVMAsmParser;LLVMAsmPrinter;LLVMBinaryFormat;LLVMBitReader;LLVMBitWriter;LLVMBitstreamReader;LLVMCFGuard;LLVMCGData;LLVMCodeGen;LLVMCodeGenTypes;LLVMCore;LLVMCoroutines;LLVMDebugInfoBTF;LLVMDebugInfoCodeView;LLVMDebugInfoDWARF;LLVMDebugInfoMSF;LLVMDebugInfoPDB;LLVMDemangle;LLVMFrontendAtomic;LLVMFrontendOffloading;LLVMFrontendOpenMP;LLVMGlobalISel;LLVMHipStdPar;LLVMIRPrinter;LLVMIRReader;LLVMInstCombine;LLVMInstrumentation;LLVMLinker;LLVMMC;LLVMMCA;LLVMMCDisassembler;LLVMMCParser;LLVMObjCARCOpts;LLVMObject;LLVMPasses;LLVMProfileData;LLVMRemarks;LLVMSandboxIR;LLVMScalarOpts;LLVMSelectionDAG;LLVMSupport;LLVMSymbolize;LLVMTarget;LLVMTargetParser;LLVMTextAPI;LLVMTransformUtils;LLVMVectorize;LLVMipo;llvm-headers;cmake-exports;lld-cmake-exports;${{ matrix.llvm_distribution_tools }}"
          -D LLVM_CONFIG_PATH=${{ github.workspace }}/BinaryCache/0/bin/llvm-config${{ matrix.executable_suffix }}
          -D LLVM_NATIVE_TOOL_DIR=${{ github.workspace }}/BinaryCache/0/bin
          -D LLVM_TABLEGEN=${{ github.workspace }}/BinaryCache/0/bin/llvm-tblgen${{ matrix.executable_suffix }}
          -D LLVM_USE_HOST_TOOLS=NO
          -D PACKAGE_VENDOR=hylo-lang.org
          -D LLVM_APPEND_VC_REV=NO
          -D LLVM_ENABLE_PROJECTS="lld"
          -D LLVM_PARALLEL_LINK_JOBS=2
          -D LLVM_VERSION_SUFFIX=""
          ${{ matrix.zstd_root_option }}

      - name: Build LLVM
        run: cmake --build ${{ github.workspace }}/BinaryCache/1 --target distribution ${{ runner.os == 'Windows' && matrix.configuration == 'Debug' && '--verbose' || '' }}

      - name: Reclaim disk space after build
        if: ${{ runner.os != 'Windows' }}
        run: |
          echo "Disk space before build cleanup:"
          df -h
          
          # Remove object files and intermediate build artifacts
          find ${{ github.workspace }}/BinaryCache/ -name '*.o' -print0 | xargs -0 rm -f
          find ${{ github.workspace }}/BinaryCache/ -name '*.obj' -print0 | xargs -0 rm -f
          find ${{ github.workspace }}/BinaryCache/ -name '*.tmp' -print0 | xargs -0 rm -f
 
          echo "Disk space after build cleanup:"
          df -h

      - name: Additional cleanup before install
        if: ${{ runner.os == 'Linux' }}
        run: |
          # Clean up more system directories if space is still tight
          AVAILABLE_SPACE=$(df / | tail -1 | awk '{print $4}')
          echo "Available space: ${AVAILABLE_SPACE}KB"
          
          # If less than 2GB available, do aggressive cleanup
          if [ "$AVAILABLE_SPACE" -lt 2097152 ]; then
            echo "Low disk space detected, performing aggressive cleanup..."
            
            # Remove more development tools and caches
            sudo rm -rf /usr/local/share/vcpkg || true
            sudo rm -rf /usr/local/share/gem || true
            sudo rm -rf /usr/share/doc || true
            sudo rm -rf /usr/share/man || true
            sudo rm -rf /var/cache/apt || true
            sudo rm -rf /tmp/* || true
            
            # Clear journal logs
            sudo journalctl --vacuum-time=1d || true
            
            echo "Disk space after aggressive cleanup:"
            df -h
          fi

      - name: Install LLVM
        run: cmake --build ${{ github.workspace }}/BinaryCache/1 --target ${{ matrix.install_target }}

      - name: Validate debug symbols (macOS Debug)
        if: ${{ runner.os == 'macOS' && matrix.configuration == 'Debug' }}
        shell: bash
        run: |
          echo "=== Debug Symbol Validation ==="
          echo "Xcode version: $(xcode-select --print-path)"
          echo "dsymutil version: $(dsymutil --version)"
          echo "clang version: $(clang --version)"
          
          # Test debug symbol format on a sample library
          SAMPLE_LIB=$(find ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/lib -name "*.a" | head -1)
          if [ -n "$SAMPLE_LIB" ]; then
            echo "Testing debug symbols in: $SAMPLE_LIB"
            dwarfdump --verify "$SAMPLE_LIB" 2>&1 | head -20 || true
            
            echo "DWARF sections:"
            dwarfdump --debug-info=0x0 "$SAMPLE_LIB" 2>&1 | head -10 || true
          fi

      - name: Patch VS path in LLVMExports.cmake (Windows only)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        working-directory: ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}
        run: |
          pwsh -File ${{ github.workspace }}/SourceCache/llvm-build/scripts/fix-vs.ps1

      - name: Test binary compatibility
        shell: bash
        run: |
          echo "=== Testing Binary Compatibility ==="
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Target Arch: ${{ matrix.arch }}"
          echo "Target Triple: ${{ matrix.triple_cpu }}-${{ matrix.triple_suffix }}"
          echo ""
          
          # Test llvm-config
          echo "Testing llvm-config..."
          "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llvm-config${{ matrix.executable_suffix }}" --version
          
          # Verify RISCV target support for ESP32-C3 cross compilation
          echo "Checking RISCV target availability..."
          "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llc${{ matrix.executable_suffix }}" --version
          if "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llc${{ matrix.executable_suffix }}" --version | grep -qi "riscv"; then
            echo "RISCV target support detected."
          else
            echo "ERROR: RISCV target support was not found in this package."
            # exit 1 todo add error if it works
          fi

          # Verify WebAssembly target support for wasm code generation
          echo "Checking WebAssembly target availability..."
          if "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin/llc${{ matrix.executable_suffix }}" --version | grep -qi "webassembly"; then
            echo "WebAssembly target support detected."
          else
            echo "ERROR: WebAssembly target support was not found in this package."
            # exit 1 todo add error if it works
          fi

      - name: Make llvm.pc pkg-config file
        shell: bash
        run: 'export PATH="${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/bin:$PATH" && "${{ github.workspace }}/SourceCache/llvm-build/scripts/make-pkgconfig.sh" "${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/llvm.pc"'

      - name: Copy pkg-config Installation Scripts
        run: |
          cp ${{ github.workspace }}/SourceCache/llvm-build/scripts/install-pc.sh ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/install-pc.sh
          cp ${{ github.workspace }}/SourceCache/llvm-build/scripts/make-absolute-pc.sh ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/make-absolute-pc.sh
          chmod +x ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/install-pc.sh
          chmod +x ${{ github.workspace }}/BuildRoot/${{ env.PACKAGE_NAME }}/pkgconfig/make-absolute-pc.sh

      - name: Package LLVM
        working-directory: ${{ github.workspace }}/BuildRoot/
        run: >-

          ${{ matrix.package_command }} ${{ github.workspace }}/${{ env.PACKAGE_NAME }}${{ matrix.package_suffix }} ${{ env.PACKAGE_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.PACKAGE_NAME }}${{ matrix.package_suffix }}
          tag_name: ${{ needs.create_tag.outputs.tag_name }}

      - name: Clear old sccache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete sccache-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-package- --confirm -R ${{ github.repository }}
        continue-on-error: true
